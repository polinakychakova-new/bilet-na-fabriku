<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Билет на шоколадную фабрику</title>
  <meta name="description" content="Тренажёр орфографии для школьников 1–4 класса: не пускай на фабрику ингредиенты с ошибками на табличке.">
  <meta name="theme-color" content="#fff6e4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Golos+Text:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="app" id="app">
    <section class="screen start">
      <span class="sticker">тренажёр орфографии · 1–4 класс</span>
      <h1 class="title">Билет на <span class="v">шоколадную</span> <span class="blk">фабрику</span></h1>
      <p class="lead">Ингредиенты идут на фабрику. Если есть ошибка на их табличке, не пускай!</p>
      <div class="parade" id="parade" aria-hidden="true"></div>
      <button class="btn dark" disabled>Скоро открытие</button>
      <p class="status" id="status">Фабрика строится: сайт работает, игра появится здесь в ближайших обновлениях.</p>
    </section>
  </main>
  <script src="assets/js/characters.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
